<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photos by Yash Solanki from around Seattle, the UW campus, and the mountains beyond.">
  <meta name="theme-color" content="#ffffff">
  <title>Photos — Yash Solanki</title>
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="../assets/photos.css">
  <script src="../assets/photos.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="../">Yash Solanki</a>
      <nav aria-label="Main navigation">
        <a href="../#projects">Projects</a>
        <a href="../writing/">Writing</a>
        <a href="./" aria-current="page">Photos</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false" title="Toggle light and dark themes" hidden>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="main" class="wrap album">
    <header class="page-title album-header">
      <h1>Around Seattle</h1>
      <p>Photos I’ve taken on the waterfront, around campus, and on trips out of town.</p>
    </header>

    <section class="photo-section" aria-labelledby="waterfront">
      <h2 id="waterfront">The waterfront</h2>
      <div class="photo-grid photo-grid-feature">
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/waterfront-after-dark.webp">
            <img src="../assets/photos/waterfront-after-dark-small.webp" srcset="../assets/photos/waterfront-after-dark-small.webp 800w, ../assets/photos/waterfront-after-dark.webp 1600w" sizes="(max-width: 39rem) calc(100vw - 2rem), (max-width: 74rem) 60vw, 700px" width="800" height="600" fetchpriority="high" alt="Seattle’s illuminated skyline and Ferris wheel reflected in dark water">
          </a>
          <figcaption>The waterfront after dark</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/great-wheel.webp">
            <img src="../assets/photos/great-wheel-small.webp" width="600" height="800" decoding="async" alt="The Seattle Great Wheel glowing violet above the waterfront">
          </a>
          <figcaption>The Great Wheel</figcaption>
        </figure>
      </div>

      <div class="photo-grid">
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/night-on-the-waterfront.webp">
            <img src="../assets/photos/night-on-the-waterfront-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="A person at a railing with the lit Seattle skyline behind them">
          </a>
          <figcaption>A night on the waterfront</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/marina-at-dusk.webp">
            <img src="../assets/photos/marina-at-dusk-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="Boats moored beneath a cloudy blue sky at dusk">
          </a>
          <figcaption>Blue hour at the marina</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/last-light.webp">
            <img src="../assets/photos/last-light-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="Dark waves below a thin strip of orange sunset">
          </a>
          <figcaption>Last light on the water</figcaption>
        </figure>
      </div>
    </section>

    <section class="photo-section" aria-labelledby="campus">
      <h2 id="campus">Around campus</h2>
      <div class="photo-grid photo-grid-pairs">
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/cherry-blossoms.webp">
            <img src="../assets/photos/cherry-blossoms-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="The UW Quad at blue hour, with illuminated cherry blossoms along both sides">
          </a>
          <figcaption>Cherry blossoms in the Quad</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/drumheller-at-twilight.webp">
            <img src="../assets/photos/drumheller-at-twilight-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="A reflecting pool and a tree-lined view toward Mount Rainier under a pale sky">
          </a>
          <figcaption>Drumheller at twilight</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/rainier-over-rooftops.webp">
            <img src="../assets/photos/rainier-over-rooftops-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="Snow-covered Mount Rainier rising beyond trees and rooftops">
          </a>
          <figcaption>Rainier over the rooftops</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/drumheller-fountain.webp">
            <img src="../assets/photos/drumheller-fountain-small.webp" width="800" height="600" loading="lazy" decoding="async" alt="Ducks on the water in front of tall fountain jets and autumn trees">
          </a>
          <figcaption>Drumheller Fountain</figcaption>
        </figure>
      </div>
    </section>

    <section class="photo-section" aria-labelledby="mountains">
      <h2 id="mountains">Out toward the mountains</h2>
      <div class="photo-grid">
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/evergreen-road.webp">
            <img src="../assets/photos/evergreen-road-small.webp" width="600" height="800" loading="lazy" decoding="async" alt="A straight road between tall evergreen trees under a clear sky">
          </a>
          <figcaption>A road through the evergreens</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/rainier-through-the-trees.webp">
            <img src="../assets/photos/rainier-through-the-trees-small.webp" width="600" height="800" loading="lazy" decoding="async" alt="Mount Rainier framed by trees overlooking a small body of water">
          </a>
          <figcaption>Rainier through the trees</figcaption>
        </figure>
        <figure class="photo-card">
          <a class="photo-link" href="../assets/photos/mountain-valley.webp">
            <img src="../assets/photos/mountain-valley-small.webp" width="600" height="800" loading="lazy" decoding="async" alt="Sunlight over a steep forested valley and a ridge in the distance">
          </a>
          <figcaption>Looking down into the valley</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <dialog class="photo-viewer" aria-label="Photo viewer">
    <div class="photo-viewer-body">
      <figure>
        <div class="photo-viewer-media"></div>
        <figcaption class="photo-viewer-caption" aria-live="polite"></figcaption>
      </figure>
      <div class="photo-viewer-controls">
        <button class="photo-previous" type="button">Previous</button>
        <span class="photo-viewer-count"></span>
        <button class="photo-next" type="button">Next</button>
        <form method="dialog">
          <button type="submit" autofocus>Close</button>
        </form>
      </div>
    </div>
  </dialog>

  <footer class="site-footer wrap">
    <a class="wordmark" href="../">Yash Solanki</a>
    <nav class="contact-links" aria-label="Social and contact links">
      <a href="https://github.com/YashSolanki2007">GitHub</a>
      <a href="https://www.linkedin.com/in/yashsolanki07">LinkedIn</a>
      <a href="mailto:yashmpsolanki@gmail.com">Email</a>
    </nav>
  </footer>
</body>
</html>
